<!DOCTYPE html> 
<html lang="zh-Hant"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>睿立集團｜ERP</title> 
    <script src="https://cdn.tailwindcss.com"></script> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> 
     
    <link rel="stylesheet" href="./css/variables.css"> 
    <link rel="stylesheet" href="./css/layout.css"> 

    <script> 
        tailwind.config = { 
            theme: { 
                extend: { 
                    colors: { 
                        ruili: { 
                            bg: 'var(--ruili-bg)', 
                            brand: 'var(--ruili-brand)', 
                            sidebar: 'var(--ruili-sidebar)', 
                            matcha: 'var(--ruili-matcha)', 
                            pink: 'var(--ruili-pink)', 
                            dark: 'var(--ruili-dark)', 
                            border: 'var(--ruili-border)' 
                        } 
                    } 
                } 
            } 
        } 
    </script>
    <style>
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
        .table-scroll-container {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
    </style>
</head> 
<body class="bg-ruili-bg text-ruili-dark flex h-screen overflow-hidden font-sans text-sm"> 

    <!-- 側邊欄（精緻調降尺寸） -->
    <aside class="ruili-sidebar bg-ruili-sidebar text-white w-56 flex flex-col justify-between p-4 border-r border-ruili-dark/50">
        <div>
            <div class="flex items-center gap-2.5 mb-6 px-1">
                <div class="w-8 h-8 bg-ruili-brand rounded-md flex items-center justify-center font-semibold text-base shadow-sm">睿</div>
                <div>
                    <h1 class="font-medium text-sm tracking-wide leading-tight">睿立集團</h1>
                    <p class="text-[10px] text-gray-400 tracking-wider">RUILI Group ERP</p>
                </div>
            </div>
            <nav class="space-y-1">
                <a href="#" class="block px-3 py-2 rounded-lg bg-ruili-brand/20 text-white text-xs font-medium tracking-wide"><i class="fa-solid fa-house mr-2 text-xs"></i>主控台</a>
            </nav>
        </div>
        <div class="text-[11px] text-gray-400 border-t border-gray-700/60 pt-3 px-1">
            身分：<strong class="text-gray-200 font-normal">最高管理者</strong>
        </div>
    </aside>

    <!-- 主畫面內容（精緻化標題與卡片） -->
    <main class="ruili-main flex-1 flex flex-col overflow-y-auto bg-ruili-bg p-5">
        <header class="mb-5 flex justify-between items-center">
            <h2 class="text-lg font-semibold text-ruili-dark flex items-center gap-2 tracking-wide">
                <i class="fa-solid fa-chart-line text-base text-gray-600"></i>睿立集團營運主控台
            </h2>
            <span class="text-xs bg-emerald-50 text-emerald-700 border border-emerald-200/60 px-2.5 py-0.5 rounded-full font-normal">系統運行中</span>
        </header>

        <section class="bg-white rounded-lg p-5 shadow-sm border border-ruili-border mb-5">
            <h3 class="text-sm font-semibold text-gray-800 mb-1.5">歡迎使用全新架構 ERP</h3>
            <p class="text-xs text-gray-500 leading-relaxed">系統骨架與 API 連線完成。</p>
        </section>
    </main>

    <!-- 引入資料同步與獨立測試模組 --> 
    <script src="./js/api/data-sync.js"></script>
    <script src="./js/api/mock-data.js"></script>
</body> 
</html>
